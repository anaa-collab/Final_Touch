<!-- ============================================================================
     BUTTONS & CTAs — copy any line into a Code Block, anywhere.
     All are live, styled links. Edit the label (between the tags) and the
     href. Wrap two or more in <div class="ft-actions">…</div> to space them.
     ========================================================================= -->

<!-- ▸ PRIMARY (brass) — your main CTA. Use once per view. -->
<a class="ft-btn ft-btn-primary" href="#quote">Request a walkthrough <span class="ar">→</span></a>

<!-- ▸ GHOST (outline) — secondary action. Auto-inverts inside .ft-on-dark. -->
<a class="ft-btn ft-btn-ghost" href="#process">See our process</a>

<!-- ▸ NAVY fill — good on bone or brass backgrounds. -->
<a class="ft-btn ft-btn-navy" href="tel:+14079848024">Call (407) 984-8024</a>

<!-- ▸ Large primary -->
<a class="ft-btn ft-btn-primary ft-btn-lg" href="#quote">Get a same-week quote <span class="ar">→</span></a>

<!-- ▸ A PAIR, spaced (drop this after any section, e.g. Services or Process) -->
<div class="ft ft-actions" style="justify-content:center">
  <a class="ft-btn ft-btn-primary" href="#quote">Request a walkthrough <span class="ar">→</span></a>
  <a class="ft-btn ft-btn-ghost" href="tel:+14079848024">Call (407) 984-8024</a>
</div>

<!-- ▸ On a NAVY/graphite section, wrap the pair so the ghost turns bone: -->
<div class="ft ft-on-dark ft-actions">
  <a class="ft-btn ft-btn-primary" href="#quote">Get a quote</a>
  <a class="ft-btn ft-btn-ghost" href="#services">Our services</a>
</div>

     PREFER A NATIVE BUTTON BLOCK?  (100% no-code editing)
     In the editor: + → Button. In its settings pick:
       • Style: PRIMARY   → renders brass  (styled by §2 of the Custom CSS)
       • Style: SECONDARY → renders ghost/outline
     Set the Link to a page, external URL, tel:, or #anchor. Native blocks
